publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  url_launcher: ^6.3.1
  battery_plus: ^6.0.3
  android_intent_plus: ^5.2.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.3.3
